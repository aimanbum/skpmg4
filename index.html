<form id="borangPencerapan">
  <input type="text" name="nama" placeholder="Nama Guru" required>
  <input type="text" name="mata_pelajaran" placeholder="Mata Pelajaran">
  
  <label>4.1.1 (a) Menyediakan RPH:</label>
  <select name="s411a">
    <option value="4">4</option>
    <option value="3">3</option>
    <option value="2">2</option>
    <option value="1">1</option>
  </select>

  <button type="submit">Hantar Data</button>
</form>

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxMwf_xLE-9NFHipNtOPWYhQ6U7-UutUvE72hZslAbvuzhft839cTkoGIzBuzEGZV8WFg/exec';
  const form = document.getElementById('borangPencerapan');

  form.addEventListener('submit', e => {
    e.preventDefault();
    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => alert("Data Berjaya Disimpan!"))
      .catch(error => console.error('Ralat!', error.message));
  });
</script>
