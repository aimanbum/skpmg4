<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Borang SKPMg2 Standard 4</title>
    <style>
        body { background-color: #f0f2f5; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .form-container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        .header-box { background: #1e40af; color: white; padding: 20px; border-radius: 10px; margin-bottom: 30px; text-align: center; }
        .section-header { background: #e2e8f0; padding: 10px; border-left: 5px solid #1e40af; font-weight: bold; margin-top: 25px; margin-bottom: 15px; }
        .item-label { font-weight: 500; color: #334155; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header-box">
        <h2>INSTRUMEN PENCERAPAN PdPc</h2>
        <p>Standard 4: Pembelajaran dan Pemudahcaraan</p>
    </div>

    <form id="skpmgForm">
        <div class="section-header">MAKLUMAT ASAS</div>
        <div class="mb-3">
            <label class="form-label item-label">Nama Guru</label>
            <input type="text" name="nama" class="form-control" placeholder="Nama Penuh Guru" required>
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label item-label">Mata Pelajaran</label>
                <input type="text" name="mp" class="form-control" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label item-label">Kelas</label>
                <input type="text" name="kelas" class="form-control" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label item-label">Sesi</label>
                <select name="sesi" class="form-select">
                    <option value="Pagi">Pagi</option>
                    <option value="Petang">Petang</option>
                </select>
            </div>
        </div>

        <div class="section-header">SKOR ASPEK (1-4)</div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="item-label">4.1.1 Guru Sebagai Perancang</label>
                <select name="s411" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.2.1 Guru Sebagai Pengawal (Proses)</label>
                <select name="s421" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.2.2 Guru Sebagai Pengawal (Suasana)</label>
                <select name="s422" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.3.1 Guru Sebagai Pembimbing</label>
                <select name="s431" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.4.1 Guru Sebagai Pendorong (Minda)</label>
                <select name="s441" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.4.2 Guru Sebagai Pendorong (Emosi)</label>
                <select name="s442" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.5.1 Guru Sebagai Penilai</label>
                <select name="s451" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="item-label">4.6.1 Murid Sebagai Pembelajar Aktif</label>
                <select name="s461" class="form-select"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-4 p-3 fw-bold" id="submitBtn">HANTAR SKOR KE DATABASE</button>
    </form>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI BAWAH
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxEZQQWmeZ79crF6BqeHbclKpnBI7GbU4XYP1pDAXxzQzEt7ccAMAhJVKkShjssuJqWfA/exec';
    const form = document.getElementById('skpmgForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Sedang Menghantar...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert("Data Berjaya Disimpan!");
                form.reset();
                btn.disabled = false;
                btn.innerText = "HANTAR SKOR KE DATABASE";
            })
            .catch(error => {
                alert("Ralat! Data gagal dihantar.");
                btn.disabled = false;
                btn.innerText = "HANTAR SKOR KE DATABASE";
            });
    });
</script>

</body>
</html>
