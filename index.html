<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Borang Pencerapan Standard 4</title>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .form-container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        .section-title { background: #0d6efd; color: white; padding: 10px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2 class="text-center mb-4">INSTRUMEN PENCERAPAN PDPC (STANDARD 4)</h2>
    <form id="skpmgForm">
        <div class="mb-3">
            <label class="form-label">Nama Guru</label>
            <input type="text" name="nama" class="form-control" required>
        </div>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Mata Pelajaran</label>
                <input type="text" name="mp" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Kelas</label>
                <input type="text" name="kelas" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Sesi</label>
                <select name="sesi" class="form-select">
                    <option value="Pagi">Pagi</option>
                    <option value="Petang">Petang</option>
                </select>
            </div>
        </div>

        <div class="section-title">Aspek 4.1: Guru Sebagai Perancang</div>
        <div class="mt-3">
            <label>4.1.1 (a) Menyediakan RPH</label>
            <select name="s411a" class="form-select mb-2"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            
            <label>4.1.1 (b) Menentukan kaedah pentaksiran</label>
            <select name="s411b" class="form-select mb-2"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
            
            <label>4.1.1 (c) Menyediakan sumber pendidikan</label>
            <select name="s411c" class="form-select mb-2"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
        </div>

        <div class="section-title">Aspek Seterusnya</div>
        <div class="mt-3">
             <label>4.2.1 (a) Mengelola masa</label>
             <select name="s421a" class="form-select mb-2"><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select>
             </div>

        <button type="submit" class="btn btn-primary w-100 mt-4" id="submitBtn">Hantar Skor</button>
    </form>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxEZQQWmeZ79crF6BqeHbclKpnBI7GbU4XYP1pDAXxzQzEt7ccAMAhJVKkShjssuJqWfA/exec';
    const form = document.getElementById('skpmgForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "Sedang Menghantar...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert("Skor berjaya dimasukkan ke dalam Sheet!");
                form.reset();
                btn.disabled = false;
                btn.innerText = "Hantar Skor";
            })
            .catch(error => {
                alert("Ralat! Data tidak berjaya dihantar.");
                btn.disabled = false;
                btn.innerText = "Hantar Skor";
            });
    });
</script>

</body>
</html>
